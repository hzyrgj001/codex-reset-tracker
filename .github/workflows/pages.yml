name: pages
# Publishes the static visualizer (docs/index.html + data/) to GitHub Pages.
# Enable once: Settings > Pages > Source: GitHub Actions.
# Also runs after track-resets: commits made with GITHUB_TOKEN do not fire push
# workflows, so without workflow_run the public site stays stale.
on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "index.html"]
  workflow_dispatch: {}
  workflow_run:
    workflows: ["track-resets"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checkout defaults to the workflow file's SHA; pin to the
          # triggering track-resets commit (or the push SHA) so we publish fresh data.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r docs data _site/
          rm -rf _site/data/raw
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
