[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-reset-tracker"
version = "0.1.0"
description = "Unofficial tracker of public Codex / ChatGPT Work usage-reset announcements on X (not affiliated with OpenAI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Wang Qian" }]
dependencies = []

[project.optional-dependencies]
chart = ["matplotlib>=3.7"]

[project.scripts]
codex-reset-tracker = "codex_reset_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
